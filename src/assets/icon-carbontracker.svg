<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 78" fill="none">
  <!-- Horizontal orbit (faint) -->
  <ellipse cx="38" cy="39" rx="36" ry="12"
    stroke="white" stroke-width="1.3" opacity="0.38"/>

  <!-- Orbit ring 1 — tilted +32° -->
  <ellipse cx="38" cy="39" rx="36" ry="12"
    stroke="white" stroke-width="1.9" opacity="0.88"
    transform="rotate(32 38 39)"/>

  <!-- Orbit ring 2 — tilted -32° -->
  <ellipse cx="38" cy="39" rx="36" ry="12"
    stroke="white" stroke-width="1.9" opacity="0.88"
    transform="rotate(-32 38 39)"/>

  <!-- Center planet sphere -->
  <circle cx="38" cy="39" r="8.5" fill="white" opacity="0.97"/>

  <!-- Satellite dot (top-right) -->
  <circle cx="67" cy="24" r="3.8" fill="white" opacity="0.92"/>
</svg>
